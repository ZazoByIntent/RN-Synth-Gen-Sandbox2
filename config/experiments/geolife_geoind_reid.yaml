# Geo-indistinguishability vs reidentification on Geolife (design §8, P5).
# Real Geolife needs a Microsoft licence; drop the .plt tree at dataset.path to run.
#
# This is the REPORTING config: the full 182-user rung of the design §6.4 sample
# ladder, run after the 20- and 50-user measurement rungs (HANDOFF §1.11). It
# carries two author decisions of 17 Aug 2026, both grounded in the 50-rung
# measurement: population threshold 0.3 (see the map_matching comment) and
# attack budget 1200 s (see the metrics comment). The u20/u50 configs stay at
# threshold 0.05 / budget 300 s — they are the measured record of those rungs.
#
# epsilon is the geo-ind level per unit_m=100 m (mechanism default), so the grid
# {0.1, 1, 10} spans mean planar-Laplace displacements of 2 km / 200 m / 20 m.
# At epsilon=0.1 expect few or no trajectories to survive re-matching: the arm
# then reads ~0 attack accuracy with the survivor counts recorded in run.json
# ("protection by destroying the release" — the utility metrics quantify it).
experiment:
  id: geolife_geoind_reid
  seed: 42                   # run seed: mechanism noise, attacker knowledge, bootstrap
  split_seed: 42             # population seed: user subsample + split; pin it and vary
                             # only seed for repetitions (trajguard run <cfg> --seed N)
  output_dir: results/geolife_geoind_reid

map:
  source: osm
  region: beijing            # must equal the Geolife native region (orchestrator enforces)
  bbox: [116.20, 39.75, 116.55, 40.05]
  crs: EPSG:32650

dataset:
  id: geolife
  path: data/raw/geolife
  native_region: beijing
  max_users: 182             # full-scale reporting rung, stated explicitly: the
                             # max_users column in results.csv and the per-rung
                             # split in notebooks/03_s4_sweep.ipynb rely on it

cleaning:
  max_speed_kmh: 200
  min_points: 20
  min_length_m: 500
  resample_s: 5

map_matching:
  matcher: leuven            # fmm is the eventual production matcher (design §8); leuven now
  k_candidates: 8
  radius_m: 50
  gps_error_m: 20
  # S4-1 population threshold, reporting value (R3; author decision, 17 Aug 2026,
  # from the 50-rung measurement, HANDOFF §1.11 / notebooks/03_s4_sweep.ipynb §9):
  # the earlier note "0.5 should suffice from the 50-user rung up" did NOT survive
  # measurement — 0.5 projects only 81 non-members at 182 users (< 100 needed for
  # fpr = 0.01), 0.4 reaches 100 exactly, 0.3 reaches it with margin (projected
  # 118 non-members, 33/50 users covered at the 50 rung). 0.05 remains the
  # measured record of the u20/u50 rungs (their configs are unchanged).
  min_match_score: 0.3

split:
  scheme: by_user
  fractions: {train: 0.5, test: 0.2, shadow: 0.2, attack: 0.1}

privacy_mechanisms:
  - id: none
  - id: geo_indistinguishability
    params: {epsilon: [0.1, 1.0, 10.0]}   # expands into one arm per value

attacks:
  - type: reidentification
    attacker:
      known_points: [3, 5, 10]   # points the attacker knows about each target
      distance: dtw
    target_scope: [raw, protected]
  - type: reconstruction         # MAP inversion of the geo-ind noise (design §6.3);
    target_scope: [protected]    # runs per geo-ind arm, epsilon/unit_m taken from it;
                                 # identity arms are skipped (nothing to invert)
  - type: poi_inference          # home/work stay-point inference (design §6.4);
    target_scope: [protected]    # runs per protected arm on the released GPS points,
                                 # so re-matching survival does not matter here; the
                                 # 'none' arm is a ~zero-error sanity row, not protection
    attacker: {tz_offset_h: 8}   # Geolife timestamps are GMT, Beijing is UTC+8;
                                 # dwell_s/radius_m/home_hours/work_hours keep defaults
    threshold_m: 200             # a user counts as localised within 200 m

metrics:
  privacy: [top1_acc, topk_acc, linkage_rate]
  top_k: 5
  utility: [cell_js_divergence, length_dist_error]
  utility_grid: {n_rows: 20, n_cols: 20}
  bootstrap: {n: 1000, ci: 0.95}
  memory: false              # R0 (RUNNING.md §7.3): peak-memory tracing roughly
                             # doubles attack time; budget verdicts need untraced
                             # runs. peak_memory_mb stays empty in this campaign.
  # Budget raised 300 -> 1200 s for the 182 rung (R3; author decision, 17 Aug 2026,
  # from the 50-rung measurement, HANDOFF §1.11): at threshold 0.3 the projected
  # gallery is ~590 traces and the dearest call (reidentification k10, DTW roughly
  # quadratic in gallery size) ~750 s — over the old budget, under this one.
  # 300 s (author decision, 5 Aug 2026) remains the budget of the u20/u50 rungs.
  attack_time_budget_s: 1200

reporting:
  export: [csv]
  # tradeoff: headline metric (at max known_points) vs cell JS divergence, per family;
  # the other four are the planned report figures (§6.8, §7.2–7.6), see docs/RUNNING.md
  plots: [tradeoff, by_epsilon, by_knowledge, mechanisms, runtime]
