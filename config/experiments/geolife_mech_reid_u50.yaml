# Mechanism-breadth sibling config at the 50-user rung of the design §6.4 sample ladder
# (20 -> 50 -> 182): the measurement rung between geolife_mech_reid_u20.yaml (measured
# 4 Sep 2026, docs/HANDOFF.md §2.3) and geolife_mech_reid_u182.yaml. It mirrors the S4
# pair geolife_geoind_reid_u20.yaml -> geolife_geoind_reid_u50.yaml: only
# dataset.max_users, experiment.id and output_dir differ from the u20 file; population
# threshold 0.05, budget 300 s and memory: false stay (docs/RUNNING.md §7.4, §7.3 R0), so
# this rung is measured at the same settings as S4's u50 rung. The raw-pool cache of
# geolife_geoind_reid_u50.yaml is shared (same population, cleaning, matching, split).
# NOT RUN YET (file created 4 Sep 2026, aligned to the full arm grid 22 Sep 2026). This
# rung is NO LONGER SKIPPED: the author runs it next, after geolife_mech_mia_u50.yaml and
# before the 182 rung.
#
# Full grid at every rung (author decision, 22 Sep 2026): u20, u50 and u182 now carry
# exactly the same 16 arms — `none`, three geo-ind ε, three point_ldp ε and three
# parameters for each of the naive trio — so the comparison notebook
# (docs/NACRT_MEHANIZMI.md §1.6) puts the same arms side by side at all three rungs
# instead of explaining gaps. The destructive arms (rounding 500 / 2000 m, Gaussian
# 200 / 1000 m, point_ldp ε = 4 / 6) earn their cost even when their re-matched pool is
# empty: the run records how many releases the map matcher threw away
# (`n_rematch_dropped` in run.json), which is what tells "the mechanism protected the
# user" apart from "the mechanism destroyed the matcher's input", and the `release` entry
# below scores those same arms over the points they actually publish, so each of them
# gets a risk number instead of a blank row.
#
# Three reidentification entries (22 Sep 2026), all reported next to each other, never
# instead of each other:
#   1. `dtw` over the re-matched gallery — the campaign's reference attacker.
#   2. `dtw_norm` over the same gallery — DTW divided by the path length, so a long
#      trajectory is no longer penalised for being long (docs/HANDOFF.md §2.5.1).
#   3. `dtw_norm` over the `release` gallery — the full released GPS points projected into
#      the map CRS, with no re-matching, so an arm that loses every trajectory at
#      re-matching no longer looks like perfect protection (docs/HANDOFF.md §2.5.2).
#
# Cost ESTIMATE (single seed; author's estimate of 22 Sep 2026, extrapolated from the u20
# run and the S4 u50 record — nothing in this file is measured):
#   Base (the two re-matched entries, reconstruction, POI, utility) ~1.4 h. Reidentification
#     on the two full pools (`raw`, `none`) compares DTW against the whole gallery, so its
#     cost grows roughly quadratically with the pool (measured exponent ~1.9,
#     docs/HANDOFF.md §1.3): ~8 min for the two 238-trace pools at u20 -> ~30 min for the
#     465-trace gallery of this rung per distance, with the k = 10 calls (~470 s each) over
#     the 300 s budget exactly as in S4. Downsampled galleries are 5–70x cheaper per pair;
#     rounding 100 m keeps ~45 % of the traces; the arms that drop nearly the whole pool at
#     re-matching pay only their re-matching (~2–3 min for all perturbing arms at this rung).
#   Release entry at k = 3 / 5 / 10, ~10.6 h. A release carries the full point stream, ~3.3x
#     the points of a matched trace, and the attacker's DTW is a Python double loop, so one
#     full-release call costs ~3.3x a matched pool-call at the same k (~150 / 250 / 470 s):
#     13 of the 16 arms release the full stream, the three `temporal_downsampling` ones
#     release a thinned stream and cost ~14 min together.
#   Total ~12 h per seed; three seeds (`trajguard repeat --seeds 1 2 3`) ~36 h. About 44 of
#   these calls exceed the 300 s budget below; that is recorded in run.json as over_budget
#   and is not an error (rule R1, docs/RUNNING.md §7.3).
#   Trimming: `known_points: [3]` on the release entry brings the whole run down to ~3.2 h
#   per seed and costs only the release attacker's k = 5 / 10 columns.
#
# Run it (the author, not a session; detached, after geolife_mech_mia_u50.yaml):
#   $env:PYTHONHASHSEED=0; uv run trajguard repeat config/experiments/geolife_mech_reid_u50.yaml --seeds 1 2 3
#
# Arms and their units are unchanged from the u20 header (read it for the per-arm
# expectations): `point_ldp` ε is spent PER POINT over 20 x 20 cells (the orchestrator
# injects the map bbox; never set bbox here), geo-ind ε is per 100 m per point, the naive
# trio has no ε and no guarantee. All are baseline candidates (decision D5 is open).
experiment:
  id: geolife_mech_reid_u50
  seed: 42                   # run seed: mechanism noise, attacker knowledge, bootstrap
  split_seed: 42             # population seed: user subsample + split; pinned across seeds
  output_dir: results/geolife_mech_reid_u50

map:
  source: osm
  region: beijing            # must equal the Geolife native region (orchestrator enforces)
  bbox: [116.20, 39.75, 116.55, 40.05]
  crs: EPSG:32650

dataset:
  id: geolife
  path: data/raw/geolife
  native_region: beijing
  max_users: 50              # design §6.4 sample ladder: 20/50/100/182

cleaning:
  max_speed_kmh: 200
  min_points: 20
  min_length_m: 500
  resample_s: 5

map_matching:
  matcher: leuven
  k_candidates: 8
  radius_m: 50
  gps_error_m: 20
  # S4-1 population threshold, same as the frozen u50 config (docs/RUNNING.md §7.4)
  min_match_score: 0.05

split:
  scheme: by_user
  fractions: {train: 0.5, test: 0.2, shadow: 0.2, attack: 0.1}

privacy_mechanisms:
  - id: none
  - id: geo_indistinguishability
    params: {epsilon: [0.1, 1.0, 10.0]}  # ε per unit_m = 100 m per point; 1.0 is the S4 anchor
  - id: point_ldp
    params: {epsilon: [4.0, 6.0, 8.0]}   # ε per point over 20 x 20 cells (see u20 header)
  - id: spatial_rounding
    params: {cell_m: [100, 500, 2000]}   # metres; no guarantee
  - id: temporal_downsampling
    params: {interval_s: [30, 120, 600]} # seconds; first and last point kept
  - id: gaussian_noise
    params: {sigma_m: [50, 200, 1000]}   # metres per axis; no guarantee

attacks:
  - type: reidentification
    attacker:
      known_points: [3, 5, 10]   # points the attacker knows about each target
      distance: dtw
    target_scope: [raw, protected]
  - type: reidentification      # normalised attacker (dtw / L), decision of 22 Sep 2026
    attacker:                   # (docs/HANDOFF.md §2.5.1): reported next to `dtw`
      known_points: [3, 5, 10]
      distance: dtw_norm        # rows carry distance=dtw_norm, result_id ...:k<N>:dtw_norm
    target_scope: [raw, protected]
  - type: reidentification      # attacker over the release (no re-matching), decision of 22 Sep 2026
    attacker:                   # (docs/HANDOFF.md §2.5.2): reported next to the rematched rows
      known_points: [3, 5, 10]
      distance: dtw_norm        # rows carry distance=dtw_norm, result_id ...:k<N>:dtw_norm:release
      gallery: release          # full released GPS points projected into the map CRS
    target_scope: [protected]   # `raw` is rejected here: the raw points are the `none` arm's release
  - type: reconstruction         # MAP inversion of the geo-ind noise; skips other arms
    target_scope: [protected]
  - type: poi_inference          # home/work stay-point inference (design §6.4)
    target_scope: [protected]
    attacker: {tz_offset_h: 8}   # Geolife timestamps are GMT, Beijing is UTC+8
    threshold_m: 200             # a user counts as localised within 200 m

metrics:
  privacy: [top1_acc, topk_acc, linkage_rate]
  top_k: 5
  # M3 movement statistics, decision of 22 Sep 2026: duration reads 0 for the current
  # mechanisms (none alters timestamps; downsampling keeps the endpoints), speed reacts
  # to the changed release length.
  utility: [cell_js_divergence, length_dist_error, duration_dist_error, speed_dist_error]
  utility_grid: {n_rows: 20, n_cols: 20}
  bootstrap: {n: 1000, ci: 0.95}
  memory: false              # as in the S4 u50 config (R0 note there)
  attack_time_budget_s: 300  # report §6.6, X = 300 s per attack invocation
