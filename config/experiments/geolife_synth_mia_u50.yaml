# S4 sweep step: geolife_synth_mia at the 50-user rung of the design §6.4 sample
# ladder (182 -> 100 -> 50 -> 20). Same arms and attack as the full-scale config;
# only dataset.max_users and the metrics.memory switch differ.
#
# Why 50 users (RUNNING.md §7.3, R2 step 1 + §7.4): first rung after the successful
# validation run at 20 (HANDOFF_S4_POPRAVKI §4). Purpose: measure how the
# data-dependent part of the MIA cost scales for the 182-user budget projection, and
# grow the matched pool so the 0.5-threshold question (RUNNING.md §7.4) can be
# measured. min_match_score stays 0.05 until the author decides on that measurement.
# Why memory: false (R0): peak-memory tracing roughly doubles attack time, so the
# 300 s budget must be judged on untraced runs. peak_memory_mb stays empty here.
#
# Cost note: the decode-inflation calibration in rn_ldp_synth is cached per
# (map, calibration params) since S4-3, so one repeat process pays it once for all
# shadow generators, arms and seeds (~1.5 min per seed at the 20-user rung).
experiment:
  id: geolife_synth_mia_u50
  seed: 42                   # run seed: shadow subsets, generator fit noise
  split_seed: 42             # population seed: user subsample + split; pinned across seeds
  output_dir: results/geolife_synth_mia_u50

map:
  source: osm
  region: beijing            # must equal the Geolife native region (orchestrator enforces)
  bbox: [116.20, 39.75, 116.55, 40.05]
  crs: EPSG:32650

dataset:
  id: geolife
  path: data/raw/geolife
  native_region: beijing
  max_users: 50              # design §6.4 sample ladder: 20/50/100/182

cleaning:
  max_speed_kmh: 200
  min_points: 20
  min_length_m: 500
  resample_s: 5

map_matching:
  matcher: leuven
  k_candidates: 8
  radius_m: 50
  gps_error_m: 20
  # S4-1 population threshold (was 0.6): driving traces = traces that match the
  # drive network at all. Measured natural break — 85 % of cleaned u20 traces score
  # below 0.05; chosen from the diagnostic cell, notebooks/03_s4_sweep.ipynb §9.
  # Stays 0.05 at this rung; the 0.5-threshold question is measured here, not applied.
  min_match_score: 0.05

split:
  scheme: by_user
  fractions: {train: 0.5, test: 0.2, shadow: 0.2, attack: 0.1}

privacy_mechanisms: []       # no protected arms here: MIA targets the fitted generators

synthetic_generators:
  - id: markov               # non-private baseline (memorizes the train split)
    params: {order: 1}
  - id: rn_ldp_synth         # LDP prototype (docs/RN_LDP_SYNTH_DESIGN.md): one arm
    params: {epsilon: [0.5, 2.0, 8.0]}   # per epsilon; same-class shadows share the
                                         # arm's epsilon; grid/l_max keep v1 defaults

attacks:
  - type: membership_inference
    target_scope: [synthetic]
    attacker: {n_shadow: 16, subsample: 0.5}
    fprs: [0.001, 0.01, 0.1] # Carlini low-FPR operating points (design §6.2); 0.1 needs
                             # only 10 non-members (S4-2), the stricter points revive
                             # once the matched pool grows

metrics:
  privacy: []                # MIA brings its own family metrics (auc, tpr@fpr=...)
  bootstrap: {n: 1000, ci: 0.95}   # unused by MIA rows: score-based, CI across seeds
  memory: false              # see the R0 note above
  attack_time_budget_s: 300  # report §6.6, X = 300 s per attack invocation

reporting:
  export: [csv]
