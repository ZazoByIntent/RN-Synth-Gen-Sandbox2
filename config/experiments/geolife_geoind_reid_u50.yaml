# S4 sweep step: geolife_geoind_reid at the 50-user rung of the design §6.4 sample
# ladder (182 -> 100 -> 50 -> 20). Same arms and attacks as the full-scale config;
# only dataset.max_users and the metrics.memory switch differ.
#
# Why 50 users (RUNNING.md §7.3, R2 step 1 + §7.4): first rung after the successful
# validation run at 20 (docs/HANDOFF.md 1.2). Purpose is twofold: measure how the
# data-dependent attack cost scales (budget projection for the full 182-user run),
# and measure whether the stricter match threshold 0.5 would suffice (author's note,
# RUNNING.md §7.4 — the threshold in configs stays 0.05 until that measurement).
# Cost warning: reidentification compares DTW against the whole matched gallery, so
# its cost grows roughly quadratically with the pool (~27 min per seed at 20 users
# with a 238-trace gallery; expect a multiple of that here).
# Why memory: false (R0): peak-memory tracing roughly doubles attack time, so the
# 300 s budget must be judged on untraced runs. peak_memory_mb stays empty here.
#
# epsilon is the geo-ind level per unit_m=100 m (mechanism default), so the grid
# {0.1, 1, 10} spans mean planar-Laplace displacements of 2 km / 200 m / 20 m.
experiment:
  id: geolife_geoind_reid_u50
  seed: 42                   # run seed: mechanism noise, attacker knowledge, bootstrap
  split_seed: 42             # population seed: user subsample + split; pinned across seeds
  output_dir: results/geolife_geoind_reid_u50

map:
  source: osm
  region: beijing            # must equal the Geolife native region (orchestrator enforces)
  bbox: [116.20, 39.75, 116.55, 40.05]
  crs: EPSG:32650

dataset:
  id: geolife
  path: data/raw/geolife
  native_region: beijing
  max_users: 50              # design §6.4 sample ladder: 20/50/100/182

cleaning:
  max_speed_kmh: 200
  min_points: 20
  min_length_m: 500
  resample_s: 5

map_matching:
  matcher: leuven
  k_candidates: 8
  radius_m: 50
  gps_error_m: 20
  # S4-1 population threshold (was 0.6): driving traces = traces that match the
  # drive network at all. Measured natural break — 85 % of cleaned u20 traces score
  # below 0.05; chosen from the diagnostic cell, notebooks/03_s4_sweep.ipynb §9.
  # Stays 0.05 at this rung; the 0.5-threshold question is measured here, not applied.
  min_match_score: 0.05

split:
  scheme: by_user
  fractions: {train: 0.5, test: 0.2, shadow: 0.2, attack: 0.1}

privacy_mechanisms:
  - id: none
  - id: geo_indistinguishability
    params: {epsilon: [0.1, 1.0, 10.0]}   # expands into one arm per value

attacks:
  - type: reidentification
    attacker:
      known_points: [3, 5, 10]   # points the attacker knows about each target
      distance: dtw
    target_scope: [raw, protected]
  - type: reconstruction         # MAP inversion of the geo-ind noise (design §6.3)
    target_scope: [protected]
  - type: poi_inference          # home/work stay-point inference (design §6.4)
    target_scope: [protected]
    attacker: {tz_offset_h: 8}   # Geolife timestamps are GMT, Beijing is UTC+8
    threshold_m: 200             # a user counts as localised within 200 m

metrics:
  privacy: [top1_acc, topk_acc, linkage_rate]
  top_k: 5
  utility: [cell_js_divergence, length_dist_error]
  utility_grid: {n_rows: 20, n_cols: 20}
  bootstrap: {n: 1000, ci: 0.95}
  memory: false              # see the R0 note above
  attack_time_budget_s: 300  # report §6.6, X = 300 s per attack invocation

reporting:
  export: [csv]
  plots: [tradeoff, by_epsilon, by_knowledge, mechanisms, runtime]
