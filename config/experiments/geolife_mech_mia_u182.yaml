# Protection-mechanism breadth, generator branch (docs/NACRT_MEHANIZMI.md §1.4, §2):
# membership inference against synthetic generators at the 182-user REPORTING rung.
#
# This is the 182-rung sibling of geolife_mech_mia_u20.yaml — same arms, same attack,
# same split — and the counterpart of the S4 reporting config geolife_synth_mia.yaml,
# from which it takes the population settings (threshold 0.3, budget 1200 s, 182 users).
# Because cleaning, matching and split are identical to that S4 config, the two share
# the same cached raw pool (1770 matched traces, 114 users at threshold 0.3): the first
# run of this file reuses that cache instead of re-matching.
#
# Created 22 Sep 2026, NOT RUN — the author runs it. u20 and u182 are the two rungs of
# the mechanism ladder (u20 measured, u182 planned; u50 skipped by decision of
# 22 Sep 2026). The file name carries an explicit _u182 suffix (the S4 configs used no suffix
# for the 182 rung); the max_users column in results.csv remains the source of truth
# for which rung a row belongs to.
#
# Arms: `markov` (non-private memorization ceiling), `rn_ldp_synth` at ε = 2 (anchor
# from S4), `ldptrace` at ε ∈ {0.5, 2.0, 8.0} — the same ε grid as rn_ldp_synth in S4,
# for comparability; the LDPTrace paper uses {0.5, 1, 1.5} — and `privtrace` at the
# same ε grid (ZM-4, docs/NACRT_MEHANIZMI.md §5; the PrivTrace paper sweeps 0.2–2.0).
#
# ε unit: for both `rn_ldp_synth` and `ldptrace`, ε is spent PER TRAJECTORY (per
# device release; sequential composition over one device's reports). It is NOT
# comparable with geo-indistinguishability's per-point ε in the reid configs.
# LDPTrace is a baseline candidate (decision D5 in project Izbirni predmeti is open).
#
# DIFFERENT TRUST MODEL for `privtrace`: PrivTrace is CENTRAL differential privacy —
# a trusted curator sees every raw trajectory and adds Laplace noise to the grid
# densities and Markov counts; ε is per trajectory (a neighbouring database differs in
# one trajectory; a user with m trajectories is covered at m·ε). The LDP arms never
# reveal a raw trajectory to anyone. Equal nominal ε therefore does NOT mean equal
# protection: read the `privtrace` rows as an upper bound on the utility a trusted
# curator can reach, not as a like-for-like competitor (NACRT §5, §1.2). Baseline
# candidate; decision D5 is open.
#
# Cost, as an ESTIMATE (not measured for this file): the whole u20 run with these
# eight arms took 88–128 s per seed on 238 matched traces, and the S4 182 run with its
# four arms took 101–161 s per seed on 1770 traces (74–115 s at u50). The membership
# attack therefore costs almost the same whatever the pool size, so expect roughly
# 5 min per seed here, with an upper bound of about 15 min; three seeds as in S4
# (`trajguard repeat --seeds 1 2 3`). tpr@fpr = 0.001 needs 1000 non-members (S4-2), far
# beyond this rung, so it stays NaN with a validity warning; tpr@fpr = 0.01 needs 100 and
# resolves at threshold 0.3 (about 118 non-members, see the map_matching comment).
experiment:
  id: geolife_mech_mia_u182
  seed: 42                   # run seed: shadow subsets, generator fit noise
  split_seed: 42             # population seed: user subsample + split; pinned across seeds
  output_dir: results/geolife_mech_mia_u182

map:
  source: osm
  region: beijing            # must equal the Geolife native region (orchestrator enforces)
  bbox: [116.20, 39.75, 116.55, 40.05]
  crs: EPSG:32650

dataset:
  id: geolife
  path: data/raw/geolife
  native_region: beijing
  max_users: 182             # full-scale reporting rung, stated explicitly: the
                             # max_users column in results.csv and the per-rung
                             # split in notebooks/03_s4_sweep.ipynb rely on it

cleaning:
  max_speed_kmh: 200
  min_points: 20
  min_length_m: 500
  resample_s: 5

map_matching:
  matcher: leuven
  k_candidates: 8
  radius_m: 50
  gps_error_m: 20
  # S4-1 population threshold, reporting value (R3; author decision, 17 Aug 2026,
  # from the 50-rung measurement, docs/HANDOFF.md 1.3 / notebooks/03_s4_sweep.ipynb §9):
  # the earlier note "0.5 should suffice from the 50-user rung up" did NOT survive
  # measurement — 0.5 projects only 81 non-members at 182 users (< 100 needed for
  # fpr = 0.01), 0.4 reaches 100 exactly, 0.3 reaches it with margin (projected
  # 118 non-members, 33/50 users covered at the 50 rung). 0.05 remains the
  # measured record of the u20 rung (its config is unchanged).
  min_match_score: 0.3

split:
  scheme: by_user
  fractions: {train: 0.5, test: 0.2, shadow: 0.2, attack: 0.1}

privacy_mechanisms: []       # no protected arms here: MIA targets the fitted generators

synthetic_generators:
  - id: markov               # non-private baseline (memorizes the train split)
    params: {order: 1}
  - id: rn_ldp_synth         # S4 anchor at ε = 2 (docs/RN_LDP_SYNTH_DESIGN.md)
    params: {epsilon: 2.0}
  - id: ldptrace             # ZM-1 (docs/NACRT_MEHANIZMI.md §2): grid 12x12, quantile 0.9,
    params: {epsilon: [0.5, 2.0, 8.0]}   # length_share 0.1, alpha 0.3, beta 0.2 (defaults);
                                         # same-class shadows share the arm's epsilon
  - id: privtrace            # ZM-4 (docs/NACRT_MEHANIZMI.md §5): central DP, trusted curator
    params: {epsilon: [0.5, 2.0, 8.0]}   # (see header); level-1 grid 6x6 over the map's node
                                         # bbox, budget split 0.2/0.4/0.4, theta2 5, max_len 200
                                         # (defaults); same-class shadows share the arm's epsilon

attacks:
  - type: membership_inference
    target_scope: [synthetic]
    attacker: {n_shadow: 16, subsample: 0.5}
    fprs: [0.001, 0.01, 0.1] # Carlini low-FPR operating points (design §6.2); 0.1 needs
                             # only 10 non-members (S4-2), the stricter points revive
                             # once the matched pool grows

metrics:
  privacy: []                # MIA brings its own family metrics (auc, tpr@fpr=...)
  bootstrap: {n: 1000, ci: 0.95}   # unused by MIA rows: score-based, CI across seeds
                                   # comes from trajguard repeat instead
  memory: false              # R0 (RUNNING.md §7.3): peak-memory tracing roughly
                             # doubles attack time; budget verdicts need untraced
                             # runs. peak_memory_mb stays empty in this campaign.
  # Budget 1200 s, the S4 reporting value for the 182 rung (R3; author decision,
  # 17 Aug 2026, from the 50-rung measurement, docs/HANDOFF.md 1.3) — decided for the
  # campaign as a whole. 300 s remains the budget of the u20 rung.
  attack_time_budget_s: 1200

reporting:
  export: [csv]
