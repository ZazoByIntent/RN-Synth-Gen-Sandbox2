# Protection-mechanism breadth, perturbation branch (docs/NACRT_MEHANIZMI.md §1.4, §3, §4):
# reidentification, reconstruction and POI inference against protected releases at the
# 20-user rung, with the point-LDP arms (ZM-2) and the three naive baselines (ZM-3) next
# to two anchors from the S4 campaign.
#
# Why a sibling file: the S4 configs (geolife_geoind_reid*.yaml) are the frozen,
# measured record of the sample ladder and must not change. This file copies the
# u20 population, cleaning, matching, split, attacks and budget verbatim (-> the cached
# raw pool is shared) and only swaps the mechanism arms.
#
# Arms: `none` (identity, upper risk bound), `geo_indistinguishability` at ε = 1
# (anchor from S4; ε = 1 per 100 m per point), `point_ldp` at ε ∈ {4.0, 6.0, 8.0}, and
# the naive trio without a formal guarantee (privacy/naive.py, no ε, `spent_budget`
# None; the by_epsilon plot skips them, the mechanisms plot shows them by parameter):
#   `spatial_rounding` cell_m ∈ {100, 500, 2000}: every point snaps to the centre of a
#     cell_m × cell_m metre cell of a global grid (max displacement cell_m·√2/2 = 71 /
#     354 / 1414 m, mean ≈ 0.38·cell_m); consecutive points in one cell become
#     identical released points. With the 50 m matching radius, 500 and 2000 m are
#     expected to drop most trajectories at re-matching.
#   `temporal_downsampling` interval_s ∈ {30, 120, 600}: keeps the first point, then one
#     point per interval, and the last point (cleaning already resamples at 5 s, so
#     30 s keeps ~1/6 of the points, 600 s ~1/120, i.e. a few points per trajectory —
#     often too few to re-match; recorded as n_rematch_dropped, not an error).
#   `gaussian_noise` sigma_m ∈ {50, 200, 1000}: independent N(0, σ²) per axis in metres
#     (radial RMS σ·√2); σ = 200 m is in the range of geo-ind at ε = 1 (mean
#     displacement 200 m), 1000 m is expected to drop everything at re-matching.
#
# ε unit for `point_ldp`: ε is spent PER POINT over the cells of a 20 × 20 grid on the
# map bbox (k = 400 cells, ~1.5 × 1.7 km over Beijing; the mechanism's default grid,
# identical to metrics.utility_grid). Randomized response keeps the true cell with
# probability e^ε/(e^ε + 399): 0.12 at ε = 4, 0.50 at ε = 6, 0.88 at ε = 8. The
# released point is a uniformly random point inside the reported cell, so on this
# coarse grid every release is displaced by hundreds of metres and re-matching is
# expected to drop most trajectories at every ε (recorded as n_rematch_dropped).
# This per-point ε is NOT comparable with the per-trajectory ε of `ldptrace` and
# `rn_ldp_synth` (geolife_mech_mia_u20.yaml), nor with geo-ind's ε per 100 m.
# The orchestrator injects the map bbox into `point_ldp` (never set bbox here).
# Point LDP and the naive trio are baseline candidates (decision D5 in project Izbirni
# predmeti is open).
#
# Attacker over the release (extra reidentification entry, 22 Sep 2026): the entry with
# `gallery: release` below attacks the full released GPS points, projected into the map
# CRS, instead of the re-matched trajectories, so an arm that loses every trajectory at
# re-matching (Gaussian 1000 m, rounding 2000 m, the point_ldp arms) no longer looks
# like perfect protection when it only destroyed the input of the map matcher. It is a
# stronger attacker reported NEXT TO the rematched rows (docs/HANDOFF.md §2.5.2), never
# instead of them; every mechanism arm, threshold and budget above stays unchanged.
# Cost: a release carries ~352 points per trace at u20 against ~106 matched points, and
# the attacker's DTW is a Python double loop, so one full-release call costs ≈ 3.3x a
# matched-pool call: per arm ≈ 140 s at k = 3, ≈ 230 s at k = 5 and ≈ 450 s at k = 10,
# i.e. ≈ 820 s per arm for the three k together. k = 10 is over the 300 s budget set in
# `metrics.attack_time_budget_s` below; that is recorded in run.json as over_budget and
# is not an error (rule R1, docs/RUNNING.md §7.3). Eleven of the fourteen arms release
# the full point stream — every arm except the three `temporal_downsampling` ones, whose
# releases are thinned to a fraction of the points and cost ≈ 4 min together — so the
# entry adds ≈ 11 x 820 s + 4 min ≈ 2.6 h per seed on top of the run. Trim it to
# `known_points: [3]` (≈ 26 min in total) to stay inside the 300 s budget.
experiment:
  id: geolife_mech_reid_u20
  seed: 42                   # run seed: mechanism noise, attacker knowledge, bootstrap
  split_seed: 42             # population seed: user subsample + split; pinned across seeds
  output_dir: results/geolife_mech_reid_u20

map:
  source: osm
  region: beijing            # must equal the Geolife native region (orchestrator enforces)
  bbox: [116.20, 39.75, 116.55, 40.05]
  crs: EPSG:32650

dataset:
  id: geolife
  path: data/raw/geolife
  native_region: beijing
  max_users: 20              # design §6.4 sample ladder: 20/50/100/182

cleaning:
  max_speed_kmh: 200
  min_points: 20
  min_length_m: 500
  resample_s: 5

map_matching:
  matcher: leuven
  k_candidates: 8
  radius_m: 50
  gps_error_m: 20
  # S4-1 population threshold, same as the frozen u20 config (docs/RUNNING.md §7.4)
  min_match_score: 0.05

split:
  scheme: by_user
  fractions: {train: 0.5, test: 0.2, shadow: 0.2, attack: 0.1}

privacy_mechanisms:
  - id: none
  - id: geo_indistinguishability
    params: {epsilon: [1.0]}             # S4 anchor: ε per unit_m = 100 m per point
  - id: point_ldp
    params: {epsilon: [4.0, 6.0, 8.0]}   # ε per point over 20 x 20 cells (see header)
  - id: spatial_rounding
    params: {cell_m: [100, 500, 2000]}   # metres; no guarantee (see header)
  - id: temporal_downsampling
    params: {interval_s: [30, 120, 600]} # seconds; first and last point kept
  - id: gaussian_noise
    params: {sigma_m: [50, 200, 1000]}   # metres per axis; no guarantee

attacks:
  - type: reidentification
    attacker:
      known_points: [3, 5, 10]   # points the attacker knows about each target
      distance: dtw
    target_scope: [raw, protected]
  - type: reidentification      # attacker over the release (no re-matching), decision of 22 Sep 2026
    attacker:                   # (docs/HANDOFF.md §2.5.2): reported next to the rematched rows
      known_points: [3, 5, 10]
      distance: dtw_norm        # rows carry distance=dtw_norm, result_id ...:k<N>:dtw_norm:release
      gallery: release          # full released GPS points projected into the map CRS
    target_scope: [protected]   # `raw` is rejected here: the raw points are the `none` arm's release
  - type: reconstruction         # MAP inversion of the geo-ind noise; skips other arms
    target_scope: [protected]
  - type: poi_inference          # home/work stay-point inference (design §6.4)
    target_scope: [protected]
    attacker: {tz_offset_h: 8}   # Geolife timestamps are GMT, Beijing is UTC+8
    threshold_m: 200             # a user counts as localised within 200 m

metrics:
  privacy: [top1_acc, topk_acc, linkage_rate]
  top_k: 5
  utility: [cell_js_divergence, length_dist_error]
  utility_grid: {n_rows: 20, n_cols: 20}
  bootstrap: {n: 1000, ci: 0.95}
  memory: false              # as in the S4 u20 config (R0 note there)
  attack_time_budget_s: 300  # report §6.6, X = 300 s per attack invocation

reporting:
  export: [csv]
  plots: [tradeoff, by_epsilon, by_knowledge, mechanisms, runtime]
