# Protection-mechanism breadth, generator branch (docs/NACRT_MEHANIZMI.md §1.4, §2):
# membership inference against synthetic generators at the 50-user rung of the design
# §6.4 sample ladder (20 -> 50 -> 182).
#
# This is the middle rung between geolife_mech_mia_u20.yaml (measured) and
# geolife_mech_mia_u182.yaml — same arms, same attack, same split — and the counterpart
# of the S4 config geolife_synth_mia_u50.yaml, from which it takes the population
# settings (50 users, threshold 0.05, budget 300 s, memory: false). Because cleaning,
# matching and split are identical to that S4 config, the two share the same cached raw
# pool: the first run of this file reuses that cache instead of re-matching.
#
# Created 22 Sep 2026, NOT RUN — the author runs it. The u50 rung was briefly marked as
# skipped on 22 Sep 2026; that decision was revised the same day, and this file is the
# FIRST of the remaining mechanism runs: geolife_mech_mia_u50.yaml, then
# geolife_mech_reid_u50.yaml, then the two u182 configs. The file name carries an
# explicit _u50 suffix; the max_users column in results.csv remains the source of truth
# for which rung a row belongs to.
#
# Arms: `markov` (non-private memorization ceiling), `rn_ldp_synth`, `ldptrace` and
# `privtrace`, each at ε ∈ {0.5, 2.0, 8.0}. All three generators share one ε grid (the
# rn_ldp_synth grid of S4) so that u20, u50 and u182 compare the same arms and the
# comparison notebook (docs/NACRT_MEHANIZMI.md §1.6) can read a generator against its
# competitor at equal nominal ε. For reference, the LDPTrace paper uses {0.5, 1, 1.5} and
# the PrivTrace paper sweeps 0.2–2.0 (ZM-4, docs/NACRT_MEHANIZMI.md §5).
#
# ε unit: for both `rn_ldp_synth` and `ldptrace`, ε is spent PER TRAJECTORY (per
# device release; sequential composition over one device's reports). It is NOT
# comparable with geo-indistinguishability's per-point ε in the reid configs.
# LDPTrace is a baseline candidate (decision D5 in project Izbirni predmeti is open).
#
# DIFFERENT TRUST MODEL for `privtrace`: PrivTrace is CENTRAL differential privacy —
# a trusted curator sees every raw trajectory and adds Laplace noise to the grid
# densities and Markov counts; ε is per trajectory (a neighbouring database differs in
# one trajectory; a user with m trajectories is covered at m·ε). The LDP arms never
# reveal a raw trajectory to anyone. Equal nominal ε therefore does NOT mean equal
# protection: read the `privtrace` rows as an upper bound on the utility a trusted
# curator can reach, not as a like-for-like competitor (NACRT §5, §1.2). Baseline
# candidate; decision D5 is open.
#
# Cost, as an ESTIMATE (not measured for this file): the whole u20 run with these
# arms took 88–128 s per seed on 238 matched traces, and the S4 runs took 74–115 s per
# seed at u50 and 101–161 s at u182. The membership attack costs almost the same whatever
# the pool size, so expect a few minutes per seed here for the ten arms — this is the
# cheapest of the four remaining mechanism runs, which is why it goes first. tpr@fpr =
# 0.001 needs 1000 non-members and tpr@fpr = 0.01 needs 100 (S4-2); at 50 users and
# threshold 0.05 both are likely out of reach, so they stay NaN with a validity warning
# and only tpr@fpr = 0.1 (10 non-members) resolves. That is expected at this rung: it is
# the scaling step towards u182, not the reporting rung.
#
# Run it (the author, not a session; detached, first of the four):
#   $env:PYTHONHASHSEED=0; uv run trajguard repeat config/experiments/geolife_mech_mia_u50.yaml --seeds 1 2 3
experiment:
  id: geolife_mech_mia_u50
  seed: 42                   # run seed: shadow subsets, generator fit noise
  split_seed: 42             # population seed: user subsample + split; pinned across seeds
  output_dir: results/geolife_mech_mia_u50

map:
  source: osm
  region: beijing            # must equal the Geolife native region (orchestrator enforces)
  bbox: [116.20, 39.75, 116.55, 40.05]
  crs: EPSG:32650

dataset:
  id: geolife
  path: data/raw/geolife
  native_region: beijing
  max_users: 50              # design §6.4 sample ladder: 20/50/100/182

cleaning:
  max_speed_kmh: 200
  min_points: 20
  min_length_m: 500
  resample_s: 5

map_matching:
  matcher: leuven
  k_candidates: 8
  radius_m: 50
  gps_error_m: 20
  # S4-1 population threshold, same as the frozen S4 u50 config geolife_synth_mia_u50.yaml
  # (docs/RUNNING.md §7.4), so the raw pool of that run is reused. The reporting value 0.3
  # (author decision, 17 Aug 2026) starts at the 182 rung, in geolife_mech_mia_u182.yaml;
  # 0.05 remains the measured record of the u20 and u50 rungs.
  min_match_score: 0.05

split:
  scheme: by_user
  fractions: {train: 0.5, test: 0.2, shadow: 0.2, attack: 0.1}

privacy_mechanisms: []       # no protected arms here: MIA targets the fitted generators

synthetic_generators:
  - id: markov               # non-private baseline (memorizes the train split)
    params: {order: 1}
  - id: rn_ldp_synth         # LDP prototype (docs/RN_LDP_SYNTH_DESIGN.md); ε = 2 is the
    params: {epsilon: [0.5, 2.0, 8.0]}   # S4 anchor, the other two complete the shared ε
                                         # grid; same-class shadows share the arm's
                                         # epsilon; grid/l_max keep v1 defaults
  - id: ldptrace             # ZM-1 (docs/NACRT_MEHANIZMI.md §2): grid 12x12, quantile 0.9,
    params: {epsilon: [0.5, 2.0, 8.0]}   # length_share 0.1, alpha 0.3, beta 0.2 (defaults);
                                         # same-class shadows share the arm's epsilon
  - id: privtrace            # ZM-4 (docs/NACRT_MEHANIZMI.md §5): central DP, trusted curator
    params: {epsilon: [0.5, 2.0, 8.0]}   # (see header); level-1 grid 6x6 over the map's node
                                         # bbox, budget split 0.2/0.4/0.4, theta2 5, max_len 200
                                         # (defaults); same-class shadows share the arm's epsilon

attacks:
  - type: membership_inference
    target_scope: [synthetic]
    attacker: {n_shadow: 16, subsample: 0.5}
    fprs: [0.001, 0.01, 0.1] # Carlini low-FPR operating points (design §6.2); 0.1 needs
                             # only 10 non-members (S4-2), the stricter points revive
                             # once the matched pool grows

metrics:
  privacy: []                # MIA brings its own family metrics (auc, tpr@fpr=...)
  bootstrap: {n: 1000, ci: 0.95}   # unused by MIA rows: score-based, CI across seeds
                                   # comes from trajguard repeat instead
  memory: false              # R0 (RUNNING.md §7.3): peak-memory tracing roughly
                             # doubles attack time; budget verdicts need untraced
                             # runs. peak_memory_mb stays empty in this campaign.
  # Budget 300 s, the value of the u20 and u50 rungs (report §6.6, X = 300 s per attack
  # invocation); 1200 s starts at the 182 rung.
  attack_time_budget_s: 300

reporting:
  export: [csv]
