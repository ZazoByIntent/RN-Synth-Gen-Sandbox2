# Membership inference (LiRA) against synthetic generators on Geolife (design §6.2).
# Real Geolife needs a Microsoft licence; drop the .plt tree at dataset.path to run.
#
# This is the REPORTING config: the full 182-user rung of the design §6.4 sample
# ladder, run after the 20- and 50-user measurement rungs (docs/HANDOFF.md 1.3). It
# carries two author decisions of 17 Aug 2026, both grounded in the 50-rung
# measurement: population threshold 0.3 (see the map_matching comment) and
# attack budget 1200 s (see the metrics comment). The u20/u50 configs stay at
# threshold 0.05 / budget 300 s — they are the measured record of those rungs.
#
# The attack asks, per trajectory: was this exact path in the generator's training
# set? Strict protocol (fair MIA, design T3): the target generator fits on the
# train split only; candidates are train paths (members) vs test paths
# (non-members); the attacker's shadow generators are same-class models trained on
# the shadow split plus the candidate paths it queries. The markov arm is the
# non-private ceiling — it memorizes, so the attack should score high there.
experiment:
  id: geolife_synth_mia
  seed: 42                   # run seed: shadow subsets, generator fit noise
  split_seed: 42             # population seed: user subsample + split; pin it and vary
                             # only seed for repetitions (trajguard run <cfg> --seed N)
  output_dir: results/geolife_synth_mia

map:
  source: osm
  region: beijing            # must equal the Geolife native region (orchestrator enforces)
  bbox: [116.20, 39.75, 116.55, 40.05]
  crs: EPSG:32650

dataset:
  id: geolife
  path: data/raw/geolife
  native_region: beijing
  max_users: 182             # full-scale reporting rung, stated explicitly: the
                             # max_users column in results.csv and the per-rung
                             # split in notebooks/03_s4_sweep.ipynb rely on it

cleaning:
  max_speed_kmh: 200
  min_points: 20
  min_length_m: 500
  resample_s: 5

map_matching:
  matcher: leuven
  k_candidates: 8
  radius_m: 50
  gps_error_m: 20
  # S4-1 population threshold, reporting value (R3; author decision, 17 Aug 2026,
  # from the 50-rung measurement, docs/HANDOFF.md 1.3 / notebooks/03_s4_sweep.ipynb §9):
  # the earlier note "0.5 should suffice from the 50-user rung up" did NOT survive
  # measurement — 0.5 projects only 81 non-members at 182 users (< 100 needed for
  # fpr = 0.01), 0.4 reaches 100 exactly, 0.3 reaches it with margin (projected
  # 118 non-members, 33/50 users covered at the 50 rung). 0.05 remains the
  # measured record of the u20/u50 rungs (their configs are unchanged).
  min_match_score: 0.3

split:
  scheme: by_user
  fractions: {train: 0.5, test: 0.2, shadow: 0.2, attack: 0.1}

privacy_mechanisms: []       # no protected arms here: MIA targets the fitted generators

synthetic_generators:
  - id: markov               # non-private baseline (memorizes the train split)
    params: {order: 1}
  - id: rn_ldp_synth         # LDP prototype (docs/RN_LDP_SYNTH_DESIGN.md): one arm
    params: {epsilon: [0.5, 2.0, 8.0]}   # per epsilon; same-class shadows share the
                                         # arm's epsilon; grid/l_max keep v1 defaults

attacks:
  - type: membership_inference
    target_scope: [synthetic]
    attacker: {n_shadow: 16, subsample: 0.5}
    fprs: [0.001, 0.01, 0.1] # Carlini low-FPR operating points (design §6.2); 0.1 needs
                             # only 10 non-members (S4-2), the stricter points revive
                             # once the matched pool grows

metrics:
  privacy: []                # MIA brings its own family metrics (auc, tpr@fpr=...)
  bootstrap: {n: 1000, ci: 0.95}   # unused by MIA rows: score-based, CI across seeds
                                   # comes from trajguard repeat instead
  memory: false              # R0 (RUNNING.md §7.3): peak-memory tracing roughly
                             # doubles attack time; budget verdicts need untraced
                             # runs. peak_memory_mb stays empty in this campaign.
  # Budget raised 300 -> 1200 s for the 182 rung (R3; author decision, 17 Aug 2026,
  # from the 50-rung measurement, docs/HANDOFF.md 1.3) — decided for the campaign as a
  # whole; MIA itself measured ~74-115 s per seed at u50, data-independent.
  # 300 s (author decision, 5 Aug 2026) remains the budget of the u20/u50 rungs.
  attack_time_budget_s: 1200

reporting:
  export: [csv]
